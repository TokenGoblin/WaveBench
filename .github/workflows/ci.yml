name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build (warnings as errors)
        run: dotnet build --no-restore -c Release

      - name: Unit tests
        run: dotnet test tests/WaveBench.Core.Tests -c Release --no-build --verbosity normal

      - name: Verification suite
        run: dotnet test tests/WaveBench.Verification -c Release --no-build --verbosity normal
